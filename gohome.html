<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>码仔的一天</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
:root{--bg:#141210;--card:#201d1a;--text:#f5efe6;--muted:#8b817a;--accent:#e89a2f;--accent2:#d2663c;--line:rgba(255,255,255,.1)}
body{min-height:100vh;background:radial-gradient(circle at 50% 5%,#211b17 0,#141210 36%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;padding:26px 16px}
.container{width:min(760px,100%);margin:auto;text-align:center}
.date{color:var(--muted);font-size:1.15rem;letter-spacing:.05em;margin:12px 0 24px}
.clock{font-size:clamp(3.1rem,11vw,5.5rem);font-weight:750;letter-spacing:.04em;font-variant-numeric:tabular-nums;margin-bottom:26px}
.clock span{display:inline-block;padding:.05em .12em;border:1px solid var(--line);border-radius:15px;background:linear-gradient(#2a2724 49%,#171513 50%);box-shadow:0 18px 38px #0005}
.hero{position:relative;width:min(390px,90vw);aspect-ratio:1;margin:0 auto 34px;display:grid;place-items:center}
.hero:before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(var(--accent) var(--progress),var(--accent2) 0 var(--progress),rgba(255,255,255,.05) 0);filter:drop-shadow(0 0 13px #e89a2f26)}
.hero:after{content:"";position:absolute;inset:5px;background:radial-gradient(circle,#231e19,#141210 70%);border-radius:50%}
.hero-inner{z-index:1;display:grid;gap:10px;justify-items:center;padding:25px}
.chip{color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:7px 15px}
.countdown{font-size:clamp(2.7rem,10vw,4.25rem);font-weight:750;font-variant-numeric:tabular-nums;letter-spacing:-.04em}
.sub{color:var(--muted);line-height:1.55}
.work-row{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;align-items:end;margin-bottom:18px}
.work-meta{grid-column:1/-1;color:var(--muted);font-size:.9rem;margin:-8px 0 0}
.pay-day-input{display:flex;align-items:center;justify-content:center;gap:3px}
.pay-day-input input{width:70px;text-align:right}
.pay-day-input i{color:var(--muted);font-style:normal}
.schedule-row{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.schedule-item{display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--muted)}
.schedule-item b{color:var(--accent);white-space:nowrap}
.label{display:block;color:var(--muted);margin-bottom:9px}
input{width:100%;border:1px solid var(--line);border-radius:15px;background:rgba(255,255,255,.055);color:var(--text);padding:13px 14px;font:inherit;font-size:1.15rem;outline:none}
input:focus{border-color:#e89a2f88;box-shadow:0 0 0 4px #e89a2f12}
input[type=time]{font-size:2rem;text-align:center}
.result{color:var(--accent);font-size:2.7rem;font-weight:750;padding:7px;font-variant-numeric:tabular-nums}
.status{color:var(--accent);font-size:1.15rem;min-height:30px;margin:20px}
.section-title{text-align:left;font-size:1.15rem;margin:32px 0 13px}
.section-title small{color:var(--muted);font-weight:400;margin-left:8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.panel{background:rgba(255,255,255,.045);border:1px solid var(--line);border-radius:20px;padding:20px;text-align:left}
.panel.full{grid-column:1/-1}
.metric-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:17px}
.metric{background:#ffffff08;border-radius:13px;padding:13px 10px}
.metric b{display:block;color:var(--accent);font-size:1.55rem;margin-top:5px;font-variant-numeric:tabular-nums}
.metric span,.hint{color:var(--muted);font-size:.88rem;line-height:1.5}
.money-live{font-size:2.2rem;color:var(--accent);font-weight:800;font-variant-numeric:tabular-nums;margin:13px 0 5px}
.money-live small{font-size:.95rem;color:var(--muted);font-weight:400}
.income-live-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.income-live{background:#ffffff08;border-radius:13px;padding:12px}
.income-live span{display:block;color:var(--muted);font-size:.82rem}
.income-live b{display:block;color:var(--accent);font-size:1.45rem;margin-top:4px;font-variant-numeric:tabular-nums}
.input-pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bonus-setting{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:8px;padding:8px 10px;border-radius:10px;background:#ffffff05}
.bonus-setting span{color:var(--muted)}
.bonus-input{display:flex;align-items:center;gap:5px}
.bonus-input input{width:76px;text-align:right}
.bonus-input i{color:var(--muted);font-style:normal}
.date-selects{display:grid;grid-template-columns:1.25fr .8fr .8fr;gap:6px}
.date-selects select{min-width:0;border:1px solid var(--line);border-radius:10px;background:#292522;color:var(--text);padding:8px 5px;font:inherit;outline:none}
.date-selects option{background:#fff;color:#201c19}
.profile-panel{grid-column:1/-1}
.earnings-panel{grid-column:1/-1}
.earnings-panel .income-live-grid{grid-template-columns:repeat(3,1fr)}
.comp-line{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.comp-line .label{margin:0}
.comp-line .money-live{margin:0}
.career-line{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:8px;padding:10px 2px 2px}
.career-line span{color:var(--muted)}
.career-line b{color:var(--accent);font-size:1.45rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.totals-grid{display:grid;grid-template-columns:1fr;gap:8px;margin-top:8px}
.totals-grid .career-line,.totals-grid .comp-line{margin:0}
.footnote{color:var(--muted);font-size:.82rem;line-height:1.6;margin-top:13px}
.extra{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.extra .panel{display:flex;justify-content:space-between;align-items:center}
.extra b{color:var(--accent);font-size:1.8rem;white-space:nowrap}
@media(max-width:560px){
  body{padding:0;align-items:flex-start;background:#141210}
  .container{
    position:relative;
    width:100%;
    min-height:100svh;
    padding:12px 14px 10px;
    background:radial-gradient(circle at 50% 18%,#211b16 0,#141210 43%);
  }
  .date{height:32px;margin:0;text-align:left;font-size:14px;line-height:32px;letter-spacing:.02em}
  .clock{position:absolute;right:14px;top:12px;margin:0;font-size:1rem;letter-spacing:.04em}
  .clock span{padding:6px 10px;border-radius:10px;box-shadow:none;background:#ffffff0a;border-color:#ffffff12}
  .hero{width:210px;height:210px;margin:2px auto 8px}
  .hero:before{filter:drop-shadow(0 0 9px #e89a2f20)}
  .hero:after{inset:4px}
  .hero-inner{gap:5px;padding:17px}
  .chip{padding:4px 10px;font-size:14px}
  .countdown{font-size:2.35rem}
  .sub{font-size:14px;line-height:1.38}
  .work-row{gap:14px;margin:0 4px 1px}
  .work-row>label,.work-row>div{min-width:0}
  .label{font-size:14px;margin-bottom:4px}
  input{min-height:38px;border-radius:10px;padding:7px 9px;font-size:16px;background:#ffffff09}
  input[type=time]{min-height:42px;font-size:1.25rem;padding:6px 8px}
  .result{font-size:1.65rem;padding:4px 2px}
  .status{font-size:14px;min-height:19px;margin:3px 0 6px}
  .section-title{font-size:18px;margin:0 1px 6px;letter-spacing:.01em}
  .section-title small{float:right;font-size:14px;margin:2px 0 0;color:#766d67}
  .grid{grid-template-columns:1fr;gap:6px}
  .panel{
    border-radius:15px;
    padding:8px 10px;
    background:linear-gradient(145deg,rgba(255,255,255,.055),rgba(255,255,255,.025));
    border-color:#ffffff12;
    box-shadow:0 7px 20px #00000018;
  }
  .panel.full{grid-column:1/-1;display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 9px;padding:8px 11px}
  .panel.full .label{grid-column:1/2;margin:0}
  .panel.full .money-live{grid-column:2/3;grid-row:1/2;margin:0;font-size:1.35rem}
  .panel.full .hint{grid-column:1/-1;font-size:14px}
  .metric-row{grid-template-columns:repeat(3,1fr);gap:4px;margin-top:6px}
  .metric{border-radius:8px;padding:6px 2px;text-align:center;background:#ffffff07}
  .metric span{font-size:14px;white-space:nowrap}
  .metric b{font-size:16px;margin-top:2px;white-space:nowrap}
  .money-live{font-size:1.3rem;margin:7px 0 2px}
  .money-live small{font-size:.66rem}
  .income-live-grid{gap:5px;margin-top:6px}
  .income-live{display:flex;align-items:center;justify-content:space-between;border-radius:8px;padding:6px 8px}
  .income-live span{font-size:14px}
  .income-live b{font-size:16px;margin:0}
  .hint{font-size:14px;line-height:1.35}
  .footnote{display:none}
  .extra{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
  .extra .panel{min-width:0;padding:7px 9px;border-radius:11px}
  .extra .hint{max-width:68%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .extra b{font-size:16px}
}
@media(max-width:360px){
  .container{padding:8px 10px}
  .clock{right:12px;top:12px}
  .hero{width:195px;height:195px;margin-bottom:5px}
  .countdown{font-size:2.15rem}
  .grid{gap:5px}
  .panel{padding:8px 9px}
  .metric{padding:5px 2px}
  .metric b{font-size:.75rem}
  .extra{margin-top:5px}
}

/* Adaptive mobile composition: width and height both participate in layout. */
@media(max-width:560px){
  body{min-height:100svh;overflow-x:hidden;overflow-y:auto}
  .container{
    min-height:100svh;
    padding:clamp(10px,2.2vw,18px);
    display:grid;
    grid-template-columns:minmax(0,1fr) auto;
    grid-auto-rows:max-content;
    align-content:space-between;
    column-gap:10px;
    row-gap:clamp(5px,.75svh,9px);
    background:
      radial-gradient(circle at 82% 4%,rgba(232,154,47,.08),transparent 25%),
      radial-gradient(circle at 18% 26%,rgba(210,102,60,.055),transparent 28%),
      #141210;
  }
  .date{
    grid-column:1;
    align-self:center;
    height:auto;
    line-height:1.25;
    color:#a49a92;
  }
  .clock{
    position:static;
    grid-column:2;
    align-self:center;
    justify-self:end;
    font-size:clamp(16px,4.3vw,20px);
  }
  .clock span{
    padding:7px 11px;
    border-radius:12px;
    background:linear-gradient(145deg,#292522,#1c1917);
    border-color:#ffffff14;
    box-shadow:inset 0 1px #ffffff0a,0 7px 18px #0003;
  }
  .hero{
    grid-column:1/-1;
    width:min(58vw,clamp(180px,22svh,220px));
    height:min(58vw,clamp(180px,22svh,220px));
    margin:0 auto;
  }
  .hero:before{
    background:conic-gradient(from -18deg,var(--accent) var(--progress),var(--accent2) 0 var(--progress),rgba(255,255,255,.055) 0);
    filter:drop-shadow(0 0 12px rgba(232,154,47,.17));
  }
  .hero:after{background:radial-gradient(circle at 50% 38%,#211c18,#141210 72%)}
  .hero-inner{gap:clamp(4px,.55svh,7px)}
  .chip{background:#ffffff05;border-color:#ffffff12;color:#aaa098}
  .countdown{
    width:100%;
    max-width:calc(100% - 18px);
    overflow:visible;
    font-size:clamp(28px,7.2vw,32px);
    font-variant-numeric:tabular-nums;
    letter-spacing:-.08em;
    line-height:1.08;
    text-align:center;
    white-space:nowrap;
    text-shadow:0 2px 18px #0008;
  }
  .sub{width:100%;font-size:14px;color:#9e948c;line-height:1.28}
  .sub span{display:block;white-space:nowrap}
  .work-row{
    grid-column:1/-1;
    margin:0;
    padding:9px 12px;
    column-gap:12px;
    row-gap:6px;
    align-items:center;
    border:1px solid #ffffff10;
    border-radius:16px;
    background:linear-gradient(145deg,#ffffff0a,#ffffff04);
  }
  .work-row>label,.work-row>div{min-width:0}
  .work-row>div,.work-row>.pay-day-field{border-left:1px solid #ffffff0d}
  .work-row>label,
  .work-row>div:not(.work-meta):not(.schedule-row){
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
  }
  .work-row .label{color:#938981}
  input[type=time]{
    position:relative;
    width:100%;
    min-height:38px;
    border:0;
    padding:3px 0;
    background:transparent;
    color:#f8f3ec;
    box-shadow:none;
    font-size:26px;
    line-height:38px;
    text-align:center;
    -webkit-appearance:none;
    appearance:none;
  }
  input[type=time]::-webkit-date-and-time-value{
    min-height:38px;
    line-height:38px;
    text-align:center;
  }
  input[type=time]::-webkit-calendar-picker-indicator{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    margin:0;
    opacity:0;
    cursor:pointer;
  }
  .pay-day-input{width:100%;height:38px}
  .pay-day-input input{
    width:42px;
    min-height:34px;
    padding:2px 0;
    border:0;
    background:transparent;
    box-shadow:none;
    color:#f0a12f;
    font-size:26px;
    font-weight:700;
    text-align:right;
    -moz-appearance:textfield;
  }
  .pay-day-input input::-webkit-inner-spin-button,
  .pay-day-input input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
  .pay-day-input i{font-size:16px;line-height:38px;color:#938981}
  .result{height:38px;line-height:38px;padding:0;color:#f0a12f;font-size:26px}
  .work-meta{
    grid-column:1/-1;
    margin:1px 0 -1px;
    padding:6px 4px 1px;
    border-left:0!important;
    border-top:1px solid #ffffff0c;
    border-radius:0;
    background:transparent;
    color:#999088;
    font-size:14px;
    line-height:1.35;
    text-align:center;
  }
  .schedule-row{
    border-left:0!important;
    border-top:1px solid #ffffff0c;
    padding-top:7px;
    gap:7px;
  }
  .schedule-item{
    min-width:0;
    padding:7px 9px;
    border-radius:10px;
    background:#ffffff05;
    font-size:14px;
  }
  .schedule-item span{
    min-width:0;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .schedule-item b{font-size:16px}
  .status{
    display:none;
  }
  .section-title{
    grid-column:1/-1;
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin:2px 1px 0;
    font-size:clamp(18px,4.8vw,21px);
  }
  .section-title small{float:none;margin:0;font-size:14px;font-weight:400}
  .grid{grid-column:1/-1;gap:clamp(5px,.65svh,8px)}
  .panel{
    padding:clamp(8px,1.15svh,11px) 11px;
    border-radius:16px;
    background:linear-gradient(145deg,rgba(255,255,255,.065),rgba(255,255,255,.027));
    box-shadow:inset 0 1px #ffffff08,0 9px 24px #00000020;
  }
  .panel input:not([type=time]){
    min-height:38px;
    border-color:#ffffff11;
    background:#ffffff08;
  }
  .profile-panel{padding:9px 12px}
  .input-pair{grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);gap:9px}
  .input-pair label{
    display:flex;
    flex-direction:column;
    align-items:stretch;
    justify-content:flex-start;
    gap:6px;
    min-width:0;
    min-height:0;
  }
  .input-pair label+label{border-top:0}
  .input-pair .label{margin:0;text-align:left;font-size:15px}
  .input-pair .label{white-space:nowrap}
  .profile-panel input:not([type=time]){
    min-width:0;
    min-height:36px;
    padding:6px 9px;
    border:0;
    background:#ffffff06;
    text-align:left;
  }
  .date-selects{width:100%;grid-template-columns:1.25fr .75fr .75fr;gap:4px}
  .date-selects select{
    width:100%;
    min-height:36px;
    border:0;
    border-radius:8px;
    background:#ffffff06;
    padding:5px 2px;
    color:#f5efe6;
    font-size:16px;
    text-align:center;
    text-align-last:center;
    -webkit-appearance:none;
    appearance:none;
    background-image:none;
  }
  .bonus-setting{margin-top:6px;padding:6px 9px;font-size:14px}
  .bonus-input input{
    width:64px;
    min-height:30px!important;
    padding:3px 4px!important;
    text-align:right!important;
    font-size:16px;
  }
  .bonus-input i{font-size:14px}
  .metric-row{
    margin-top:5px;
    padding-top:6px;
    border-top:1px solid #ffffff0c;
  }
  .metric{
    background:linear-gradient(145deg,#ffffff08,#ffffff03);
    border:1px solid #ffffff05;
  }
  .metric b,.income-live b,.extra b{color:#f0a12f}
  .income-live{background:linear-gradient(145deg,#ffffff08,#ffffff03)}
  .earnings-panel{
    border-color:rgba(232,154,47,.13);
    background:linear-gradient(120deg,rgba(232,154,47,.065),rgba(255,255,255,.028) 58%);
  }
  .earnings-panel .income-live-grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
    grid-template-areas:"today today" "second minute" "month year";
  }
  .earnings-panel .income-live{
    min-width:0;
    flex-direction:row;
    align-items:center;
    justify-content:space-between;
    gap:3px;
  }
  .earnings-panel .income-live:nth-child(1){grid-area:second}
  .earnings-panel .income-live:nth-child(2){grid-area:minute}
  .earnings-panel .income-live:nth-child(3){
    grid-area:today;
    padding:9px 11px;
    background:linear-gradient(105deg,rgba(232,154,47,.13),rgba(210,102,60,.055));
    border:1px solid rgba(232,154,47,.12);
  }
  .earnings-panel .income-live:nth-child(3) b{font-size:clamp(22px,6.5vw,29px);color:#ffad35}
  .earnings-panel .income-live:nth-child(4){grid-area:month}
  .earnings-panel .income-live:nth-child(5){grid-area:year}
  .earnings-panel .income-live:nth-child(1),
  .earnings-panel .income-live:nth-child(2),
  .earnings-panel .income-live:nth-child(4),
  .earnings-panel .income-live:nth-child(5){flex-direction:row;align-items:center}
  .earnings-panel .income-live b{max-width:100%;font-size:clamp(14px,3.8vw,17px);white-space:nowrap}

    margin-top:6px;
    padding:8px 10px;
    border-radius:9px;
    background:#ffffff04;
    font-size:14px;
  }
  .career-line b{font-size:clamp(18px,5vw,23px)}
  .comp-line{margin-top:7px;padding-top:7px}
  .comp-line .money-live{
    flex:1;
    min-width:0;
    max-width:100%;
    font-size:clamp(16px,4.5vw,20px);
    color:#ffab32;
    letter-spacing:-.03em;
    white-space:nowrap;
    text-align:right;
  }
  .totals-grid{grid-template-columns:1fr;gap:5px;margin-top:6px}
  .totals-grid .career-line,
  .totals-grid .comp-line{
    min-width:0;
    min-height:42px;
    display:flex;
    flex-direction:row;
    align-items:center;
    justify-content:space-between;
    gap:4px;
    padding:7px 9px;
    border:1px solid #ffffff08;
    border-radius:9px;
    background:#ffffff04;
  }
  .totals-grid .career-line b,
  .totals-grid .comp-line .money-live{
    width:auto;
    max-width:72%;
    overflow:hidden;
    font-size:clamp(14px,4vw,18px);
    line-height:1.2;
    text-align:right;
    text-overflow:ellipsis;
  }
  .totals-grid .career-line span,
  .totals-grid .comp-line .label{white-space:nowrap}
  .panel.full{
    border-color:rgba(232,154,47,.13);
    background:linear-gradient(110deg,rgba(232,154,47,.075),rgba(255,255,255,.025) 55%);
  }
  .panel.full .money-live{
    font-size:clamp(20px,5.5vw,27px);
    color:#ffab32;
    letter-spacing:-.03em;
  }
  .extra{
    grid-column:1/-1;
    margin:0;
    gap:7px;
  }
  .extra .panel{box-shadow:none;background:#ffffff06}
}

@media(max-width:380px){
  .container{row-gap:4px;padding:9px 10px}
  .section-title small{display:none}
  .work-row{padding:7px 9px}
  .panel{padding:7px 9px}
  .panel.full .hint{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .input-pair{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:6px}
  .earnings-panel .income-live:nth-child(1),
  .earnings-panel .income-live:nth-child(2),
  .earnings-panel .income-live:nth-child(4),
  .earnings-panel .income-live:nth-child(5){flex-direction:column;align-items:flex-start}
  .schedule-row{gap:5px}
  .schedule-item{padding:6px}
  .comp-line .label{max-width:42%}
  .comp-line .money-live{font-size:clamp(16px,4.5vw,18px)}
}

@media(max-width:560px) and (max-height:950px){
  .hero{width:min(52vw,185px);height:min(52vw,185px)}
  .hero-inner{padding:14px}
  .container{row-gap:4px}
}

@media(max-width:560px) and (max-height:760px){
  .container{align-content:start;row-gap:4px;padding-top:8px;padding-bottom:8px}
  .hero{width:min(50vw,170px);height:min(50vw,170px)}
  .hero-inner{padding:13px}
  .countdown{font-size:30px}
  .work-row{padding-top:6px;padding-bottom:6px}
  .status{padding-top:2px;padding-bottom:2px}
  .section-title{font-size:18px}
  .section-title small{display:none}
  .panel{padding-top:6px;padding-bottom:6px}
  .metric{padding-top:4px;padding-bottom:4px}
  .extra .panel{padding-top:6px;padding-bottom:6px}
}
</style>
</head>
<body>
<main class="container">
  <div class="date" id="date"></div>
  <div class="clock"><span id="clock">00:00:00</span></div>
  <section class="hero" id="hero">
    <div class="hero-inner">
      <div class="chip" id="chip">预计下班剩余</div>
      <div class="countdown" id="countdown">00:00:00</div>
      <div class="sub" id="workDetail"></div>
    </div>
  </section>
  <div class="work-row">
    <label><span class="label">上班打卡</span><input id="clockIn" type="time" value="08:30"></label>
    <div><span class="label">预计下班</span><div class="result" id="clockOut">17:45</div></div>
    <label class="pay-day-field"><span class="label">发薪日</span><span class="pay-day-input"><input id="payDay" type="number" min="1" max="31" value="15" inputmode="numeric"><i>日</i></span></label>
    <div class="work-meta" id="workMeta"></div>
    <div class="schedule-row">
      <div class="schedule-item"><span id="holidayLabel">距离下个节假日</span><b id="holidayCountdown">--</b></div>
      <div class="schedule-item"><span id="paydayLabel">距离发薪日</span><b id="payday">--</b></div>
    </div>
  </div>
  <div class="status" id="status">专注工作中</div>

  <div class="grid">
    <section class="panel profile-panel">
      <div class="input-pair">
        <label><span class="label">入职日期</span><span class="date-selects"><select id="hireYear" aria-label="入职年份"><option value="">年份</option></select><select id="hireMonth" aria-label="入职月份"><option value="">月</option></select><select id="hireDay" aria-label="入职日期"><option value="">日</option></select></span><input id="hireDate" type="hidden"></label>
        <label><span class="label">税前月薪（元）</span><input id="salary" type="number" min="0" step="100" placeholder="例如 10000" inputmode="decimal"></label>
      </div>
      <label class="bonus-setting"><span>年终奖</span><span class="bonus-input"><input id="bonusMonths" type="number" min="0" max="24" step="0.5" value="0" inputmode="decimal"><i>个月</i></span></label>
      <div class="metric-row">
        <div class="metric"><span>已入职</span><b id="tenureDays">--</b></div>
        <div class="metric"><span>补偿年限 N</span><b id="compYears">--</b></div>
        <div class="metric"><span>N+1 月数</span><b id="nPlusOneMonths">--</b></div>
      </div>
    </section>
    <section class="panel earnings-panel">
      <div class="income-live-grid">
        <div class="income-live"><span>每秒</span><b id="perSecond">¥0.0000</b></div>
        <div class="income-live"><span>每分钟</span><b id="perMinute">¥0.0000</b></div>
        <div class="income-live"><span>今日已累计</span><b id="todayEarned">¥0.00</b></div>
        <div class="income-live"><span>本月累计</span><b id="monthEarned">¥0.00</b></div>
        <div class="income-live"><span>今年累计</span><b id="yearEarned">¥0.00</b></div>
      </div>
      <div class="totals-grid">
        <div class="career-line"><span>入职累计</span><b id="careerEarned">¥0.00</b></div>
        <div class="comp-line">
          <span class="label">N+1 补偿</span>
          <div class="money-live" id="compensation">¥0.00</div>
        </div>
      </div>
    </section>
  </div>
</main>
<script>
const $=id=>document.getElementById(id), DAY=86400000;
const clockIn=$('clockIn'), hireDate=$('hireDate'), salary=$('salary'), payDay=$('payDay');
const hireYear=$('hireYear'),hireMonth=$('hireMonth'),hireDay=$('hireDay');
const bonusMonths=$('bonusMonths');
const pad=n=>String(n).padStart(2,'0');
const money=n=>new Intl.NumberFormat('zh-CN',{style:'currency',currency:'CNY',minimumFractionDigits:2}).format(n||0);
const money4=n=>new Intl.NumberFormat('zh-CN',{style:'currency',currency:'CNY',minimumFractionDigits:4,maximumFractionDigits:4}).format(n||0);
const saved=JSON.parse(localStorage.getItem('gohome-settings')||'{}');
if(saved.clockIn) clockIn.value=saved.clockIn;
if(saved.hireDate) hireDate.value=saved.hireDate;
if(saved.salary) salary.value=saved.salary;
if(saved.payDay&&saved.payDay>=1&&saved.payDay<=31)payDay.value=saved.payDay;
if(saved.bonusMonths!==undefined)bonusMonths.value=saved.bonusMonths;
function persist(){localStorage.setItem('gohome-settings',JSON.stringify({clockIn:clockIn.value,hireDate:hireDate.value,salary:salary.value,payDay:payDay.value,bonusMonths:bonusMonths.value}))}
function localDate(v){if(!v)return null;const [y,m,d]=v.split('-').map(Number);return new Date(y,m-1,d)}
function fillSelect(select,placeholder,values,suffix){
  select.innerHTML=`<option value="">${placeholder}</option>`+values.map(v=>`<option value="${v}">${v}${suffix}</option>`).join('');
}
function refreshHireDays(){
  const previous=Number(hireDay.value)||1;
  const year=Number(hireYear.value)||new Date().getFullYear();
  const month=Number(hireMonth.value)||1;
  const total=new Date(year,month,0).getDate();
  fillSelect(hireDay,'日',Array.from({length:total},(_,i)=>i+1),'日');
  if(hireYear.value&&hireMonth.value)hireDay.value=String(Math.min(previous,total));
}
function initHireDateSelectors(){
  const currentYear=new Date().getFullYear();
  fillSelect(hireYear,'年份',Array.from({length:currentYear-1949},(_,i)=>currentYear-i),'年');
  fillSelect(hireMonth,'月',Array.from({length:12},(_,i)=>i+1),'月');
  if(hireDate.value){
    const [year,month,day]=hireDate.value.split('-').map(Number);
    hireYear.value=String(year);hireMonth.value=String(month);
    refreshHireDays();hireDay.value=String(day);
  }else refreshHireDays();
}
function commitHireDate(){
  if(hireYear.value&&hireMonth.value&&hireDay.value){
    hireDate.value=`${hireYear.value}-${pad(hireMonth.value)}-${pad(hireDay.value)}`;
  }else hireDate.value='';
  persist();update();
}
initHireDateSelectors();
function startDay(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate())}
function daysBetween(a,b){return Math.max(0,Math.floor((startDay(b)-startDay(a))/DAY)+1)}
function compN(start,now){
  if(!start||start>now)return 0;
  let years=now.getFullYear()-start.getFullYear();
  const anniversary=new Date(now.getFullYear(),start.getMonth(),start.getDate());
  if(anniversary>now)years--;
  const last=new Date(start.getFullYear()+years,start.getMonth(),start.getDate());
  const months=(now.getFullYear()-last.getFullYear())*12+now.getMonth()-last.getMonth()-(now.getDate()<last.getDate()?1:0);
  return years+(months>=6?1:.5);
}
function workEndTarget(h,m,work){const start=h*60+m,lunchStart=11*60+45,lunchEnd=13*60;if(start<lunchStart){const morning=lunchStart-start;return morning>=work?start+work:lunchEnd+work-morning}return (start<lunchEnd?lunchEnd:start)+work}
function workEnd(h,m){return workEndTarget(h,m,480)}
function paydayDate(year,month,day){
  const lastDay=new Date(year,month+1,0).getDate();
  return new Date(year,month,Math.min(Math.max(1,day),lastDay));
}
function fmtSec(sec){sec=Math.max(0,Math.floor(sec));return `${pad(Math.floor(sec/3600))}:${pad(Math.floor(sec%3600/60))}:${pad(sec%60)}`}
function updateIncome(now,workedSeconds=0){
  const monthly=Math.max(0,Number(salary.value)||0);
  const daily=monthly/21.75, hourly=daily/8, perSec=hourly/3600;
  let completedWorkdays=0;
  for(let day=1;day<now.getDate();day++){
    const weekday=new Date(now.getFullYear(),now.getMonth(),day).getDay();
    if(weekday!==0&&weekday!==6)completedWorkdays++;
  }
  const monthAccrued=Math.min(monthly,completedWorkdays*daily+perSec*workedSeconds);
  $('perSecond').textContent=money4(perSec);
  $('perMinute').textContent=money4(perSec*60);
  $('todayEarned').textContent=money(perSec*workedSeconds);
  $('monthEarned').textContent=money(monthAccrued);
  const start=localDate(hireDate.value);
  if(!start){$('tenureDays').textContent='--';$('compYears').textContent='--';$('nPlusOneMonths').textContent='--';$('compensation').textContent=money(0);$('careerEarned').textContent=money(0);$('yearEarned').textContent=money(0);return}
  if(start>now){$('tenureDays').textContent='日期有误';$('compYears').textContent='--';$('nPlusOneMonths').textContent='--';$('compensation').textContent=money(0);$('careerEarned').textContent=money(0);$('yearEarned').textContent=money(0);return}
  const days=daysBetween(start,now),n=compN(start,now),months=n+1;
  const bonus=Math.min(24,Math.max(0,Number(bonusMonths.value)||0));
  const careerIncome=monthly*(12+bonus)*days/365.2425;
  const thisYearStart=new Date(now.getFullYear(),0,1);
  const effectiveYearStart=start>thisYearStart?start:thisYearStart;
  const yearIncomeDays=daysBetween(effectiveYearStart,now);
  const yearIncome=monthly*(12+bonus)*yearIncomeDays/365.2425;
  $('tenureDays').textContent=`${days} 天`;$('compYears').textContent=`${n} 个月`;$('nPlusOneMonths').textContent=`${months} 个月`;
  $('compensation').textContent=money(monthly*months);
  $('careerEarned').textContent=money(careerIncome);
  $('yearEarned').textContent=money(yearIncome);
}
let holidays=[
  {name:'中秋节',date:new Date(2026,8,25)},
  {name:'国庆节',date:new Date(2026,9,1)},
  {name:'元旦',date:new Date(2027,0,1)}
];
function updateHoliday(now){
  const today=startDay(now);
  const next=holidays.filter(x=>x.date>=today).sort((a,b)=>a.date-b.date)[0];
  if(!next){$('holidayLabel').textContent='距离下个节假日';$('holidayCountdown').textContent='--';return}
  const days=Math.round((startDay(next.date)-today)/DAY);
  $('holidayLabel').textContent=`距离${next.name}`;
  $('holidayCountdown').textContent=days===0?'今天':`${days} 天`;
}
async function loadHolidays(){
  const cacheKey='gohome-holidays-v2';
  try{
    const cached=JSON.parse(localStorage.getItem(cacheKey)||'null');
    if(cached&&Array.isArray(cached.items)&&Date.now()-cached.time<7*DAY){
      holidays=cached.items.map(x=>({name:x.name,date:localDate(x.date)})).filter(x=>x.date);
      updateHoliday(new Date());
    }
    const year=new Date().getFullYear();
    const payloads=await Promise.all([year,year+1].map(y=>fetch(`https://timor.tech/api/holiday/year/${y}/`).then(r=>{if(!r.ok)throw Error(r.status);return r.json()})));
    const items=[];
    payloads.forEach(p=>Object.values(p.holiday||{}).forEach(x=>{if(x&&x.holiday===true&&x.date&&x.name)items.push({name:x.name,date:x.date})}));
    if(items.length){
      const unique=[...new Map(items.map(x=>[`${x.name}-${x.date}`,x])).values()];
      holidays=unique.map(x=>({name:x.name,date:localDate(x.date)})).filter(x=>x.date).sort((a,b)=>a.date-b.date);
      localStorage.setItem(cacheKey,JSON.stringify({time:Date.now(),items:unique}));
      updateHoliday(new Date());
    }
  }catch(e){updateHoliday(new Date())}
}
function update(){
  const now=new Date(),week=['日','一','二','三','四','五','六'];
  $('date').textContent=`${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 星期${week[now.getDay()]}`;
  $('clock').textContent=`${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
  const [h,m]=clockIn.value.split(':').map(Number),endMin=workEnd(h,m),endH=Math.floor(endMin/60)%24,endM=endMin%60;
  const mealMin=workEndTarget(h,m,600),mealH=Math.floor(mealMin/60)%24,mealM=mealMin%60;
  $('clockOut').textContent=`${pad(endH)}:${pad(endM)}`;
  const nowS=now.getHours()*3600+now.getMinutes()*60+now.getSeconds(),startS=(h*60+m)*60,endS=endMin*60;
  let worked=Math.max(0,nowS-startS);if(nowS>13*3600&&startS<11*3600+45*60)worked-=75*60;else if(nowS>11*3600+45*60&&startS<11*3600+45*60)worked-=nowS-(11*3600+45*60);
  worked=Math.max(0,worked);
  if(nowS<startS){$('chip').textContent='距离上班';$('countdown').textContent=fmtSec(startS-nowS);$('status').textContent='还没到上班时间'}
  else if(nowS<endS){$('chip').textContent='预计下班剩余';$('countdown').textContent=fmtSec(endS-nowS);$('status').textContent=nowS>=11*3600+45*60&&nowS<13*3600?'午休中，好好休息':'专注工作中'}
  else{$('chip').textContent='今日工作完成';$('countdown').textContent='00:00:00';$('status').textContent='到点了，今天辛苦了'}
  const mealLeft=Math.max(0,10*3600-worked);
  const workedText=`${Math.floor(worked/3600)}时${Math.floor(worked%3600/60)}分`;
  const mealText=mealLeft>0
    ? `餐补 ${pad(mealH)}:${pad(mealM)} · 还差 ${Math.floor(mealLeft/3600)}时${Math.floor(mealLeft%3600/60)}分`
    : '已满足 10 小时餐补';
  $('workDetail').innerHTML=`<span>${pad(endH)}:${pad(endM)} 下班</span>`;
  $('workMeta').textContent=`已工作 ${workedText} · ${mealText}`;
  $('hero').style.setProperty('--progress',`${Math.min(100,worked/(8*3600)*100)}%`);
  updateHoliday(now);
  const configuredPayDay=Math.min(31,Math.max(1,Number(payDay.value)||15));
  let pay=paydayDate(now.getFullYear(),now.getMonth(),configuredPayDay);
  if(startDay(pay)<startDay(now))pay=paydayDate(now.getFullYear(),now.getMonth()+1,configuredPayDay);
  const pd=Math.round((startDay(pay)-startDay(now))/DAY);$('payday').textContent=pd===0?'今天':`${pd} 天`;
  $('paydayLabel').textContent='距离发薪';
  updateIncome(now,worked);
}
[clockIn,salary,payDay,bonusMonths].forEach(el=>el.addEventListener('input',()=>{persist();update()}));
[hireYear,hireMonth].forEach(el=>el.addEventListener('change',()=>{refreshHireDays();commitHireDate()}));
hireDay.addEventListener('change',commitHireDate);
payDay.addEventListener('blur',()=>{
  payDay.value=String(Math.min(31,Math.max(1,Number(payDay.value)||15)));
  persist();update();
});
bonusMonths.addEventListener('blur',()=>{
  bonusMonths.value=String(Math.min(24,Math.max(0,Number(bonusMonths.value)||0)));
  persist();update();
});
loadHolidays();update();setInterval(update,1000);
</script>
</body>
</html>
